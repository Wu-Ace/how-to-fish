<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>How to Fish 礼物控制台</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0c1c25;color:#e9eee7;font:15px 'Microsoft YaHei',sans-serif}main{max-width:1320px;margin:auto;padding:34px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #29434a;padding-bottom:24px}h1{margin:5px 0;font-size:34px}p{color:#9db4b7;line-height:1.8}select,input,button{font:inherit;color:inherit;background:#17323a;border:1px solid #36515a;border-radius:8px;padding:12px}button{cursor:pointer}button:hover{border-color:#ffc078}button:disabled{opacity:.5;cursor:wait}.accent{background:#e7ab65;color:#17262a;border:0;font-weight:bold}.layout{display:grid;grid-template-columns:1fr 350px;gap:28px;margin-top:25px}.search{width:100%;margin-bottom:16px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}nav button{padding:8px 15px}nav .on{background:#2c5f62}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.gift{text-align:left;padding:18px;background:#122932;min-height:99px}.gift strong{display:block;font-size:17px;margin-bottom:10px}.gift small{color:#87a4a9;font-size:11px;overflow-wrap:anywhere}.gift.selected{border-color:#ffc078;background:#204149}aside{background:#112931;border:1px solid #29454d;border-radius:12px;padding:24px;align-self:start;position:sticky;top:20px}label{display:block;margin:20px 0 8px;color:#9db4b7}aside input{width:100%}#trigger{width:100%;margin-top:25px}#status{font-size:13px;color:#7ed6bd;margin:12px 0;line-height:1.9}#log{font-size:12px;color:#9db4b7;max-height:200px;overflow:auto;line-height:1.9}#result{min-height:25px;color:#ffc078;margin-top:15px}.eyebrow{color:#ffc078;letter-spacing:3px;font-size:12px}.badge{font-size:12px;color:#8fb5b9}footer{margin:30px 0;color:#819b9f;font-size:12px}@media(max-width:1050px){.layout{grid-template-columns:minmax(0,1fr) 300px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}}@media(max-width:700px){.layout{display:flex;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}aside{position:static;order:-1;width:100%}}</style>
<main><header><div><div class="eyebrow">HOW TO FISH / GIFT LAB</div><h1>礼物控制台</h1><p>选择礼物，调整参数，直接触发游戏内效果。</p></div><div><select id="mode"><option value="sandbox">独立重实现 · 6091</option><option value="original">Steam 原版 + 插件 · 6090</option></select><div id="status">正在连接…</div></div></header>
<div class="layout"><section><input id="search" class="search" placeholder="搜索礼物名称、事件 ID"><nav id="groups"></nav><div class="grid" id="gifts"></div></section><aside><div class="badge" id="eventid"></div><h2 id="name">选择礼物</h2><p id="description"></p><label for="duration">持续时间（秒）</label><input id="duration" type="number" min="1" max="120" value="8"><label for="value">效果数值</label><input id="value" type="number" step="0.1" value="1"><label for="count">数量 / 次数</label><input id="count" type="number" min="1" max="3" value="1"><label for="fish">鱼种 / 物品名</label><input id="fish" value="random"><button id="trigger" class="accent">触发礼物</button><div id="result" role="status"></div><h3>触发记录</h3><div id="log"></div></aside></div><footer>仅连接本机游戏。Steam 原版需从 Steam 启动并进入存档，且加载 HypeMyStream 插件。独立版可直接启动工程内的 EXE。原版请求接收后可能因没有首领、手持物或武器而失败，状态区会显示游戏返回的原因。</footer></main>
<script>
let gifts=[],selected,group='全部';const $=id=>document.getElementById(id);const log=[];
function parameter(id){if(id.startsWith('money/')||['player/heal','player/damage','player/feed','player/hunger','bait/refill'].includes(id))return 'amount';return {'loot/next_heavy_fish':'weightMultiplier','economy/next_sale_boost':'payoutMultiplier','fishing/slow_bite':'delayMultiplier','boss/heal':'healPercent','chaos/spawn_giant_fish':'scale','chaos/spawn_tiny_fish':'scale','chaos/dynamite':'fuseSeconds','visual/slow_motion':'timeScale','visual/speed_up':'timeScale'}[id]||'multiplier'}
function choose(g){selected=g;$('eventid').textContent=g.id;$('name').textContent=g.name;$('description').textContent=g.description;$('duration').value=g.duration||8;$('duration').disabled=!g.duration;$('value').value=g.value;$('count').value=1;draw()}
function draw(){const q=$('search').value.toLowerCase();$('gifts').replaceChildren();for(const g of gifts.filter(x=>(group==='全部'||x.group===group)&&(x.name.toLowerCase().includes(q)||x.id.includes(q)))){const b=document.createElement('button');b.className='gift'+(selected===g?' selected':'');const strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=g.name;small.textContent=g.id;b.append(strong,small);b.onclick=()=>choose(g);$('gifts').append(b)}}
async function status(){try{const r=await fetch('/'+$('mode').value+'/api/state');const s=await r.json();if(!r.ok)throw Error(s.message);$('status').textContent=(s.ready?'已连接 · ':'请先进入游戏 · ')+`生命 ${Math.round(s.health||0)} / 金币 ${s.money||0} / 事件 ${s.eventCount||0}`+(s.lastError?' · '+s.lastError:'')}catch(e){$('status').textContent='未连接 · '+e.message}}
$('search').oninput=draw;$('mode').onchange=status;$('trigger').onclick=async()=>{if(!selected)return;$('trigger').disabled=true;const value=Number($('value').value),body={count:Number($('count').value),uses:Number($('count').value),birdCount:Number($('count').value),fish:$('fish').value,item:$('fish').value};body[parameter(selected.id)]=value;if($('mode').value==='sandbox')body.value=value;if(selected.duration)body.durationSeconds=Number($('duration').value);if(['chaos/launch','chaos/yeet_held_item','chaos/boat_boost'].includes(selected.id))body.force=value<20?'gentle':value>30?'wild':'strong';body.direction=selected.id==='chaos/launch'?'up':'forward';body.torque='strong';body.density='heavy';body.intensity='medium';body.colour='red';body.cookLevel='cooked';try{const r=await fetch('/'+$('mode').value+'/api/'+selected.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const s=await r.json();if(!r.ok||!s.ok)throw Error(s.message||'触发失败');$('result').textContent='请求已接收 · '+selected.name;log.unshift(new Date().toLocaleTimeString()+' '+selected.name);$('log').textContent=log.slice(0,15).join('\n');$('log').style.whiteSpace='pre-line';await status()}catch(e){$('result').textContent=e.message}finally{$('trigger').disabled=false}};
fetch('/catalog.json').then(r=>r.json()).then(data=>{gifts=data;for(const c of ['全部',...new Set(gifts.map(x=>x.group))]){const b=document.createElement('button');b.textContent=c;b.className=c===group?'on':'';b.onclick=()=>{group=c;for(const n of $('groups').children)n.classList.toggle('on',n===b);draw()};$('groups').append(b)}choose(gifts[0]);status()});setInterval(status,2000);
</script></html>
